<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Online MCQ Test</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #eef2f7;
  display: flex;
  justify-content: center;
  padding: 20px;
}

.container {
  display: flex;
  width: 1000px;
  max-width: 100%;
  background: white;
  border-radius: 12px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.1);
  overflow: hidden;
}

.main {
  flex: 1;
  padding: 25px;
  min-width: 300px;
}

#timer {
  text-align: right;
  font-weight: bold;
  color: red;
  font-size: 18px;
}

.question {
  margin: 20px 0;
  font-size: 18px;
}

.options label {
  display: block;
  margin: 8px 0;
  padding: 6px;
  border-radius: 6px;
  cursor: pointer;
  border: 1px solid #ddd;
}

.buttons {
  margin-top: 20px;
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

button {
  padding: 8px 15px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  background: #4CAF50;
  color: white;
}

button:hover {
  opacity: 0.9;
}

.review-btn {
  background: #9c27b0;
}

.sidebar {
  width: 220px;
  background: #f5f5f5;
  padding: 10px;
  border-left: 1px solid #ddd;
  display: grid;
  grid-template-columns: repeat(4, 45px);
  gap: 8px;
  max-height: 650px;
  overflow-y: auto;
}

.sidebar button {
  width: 45px;
  height: 45px;
  font-weight: bold;
}

.not-visited { background: #fff; color: black; }
.visited { background: #f44336; color: white; }
.answered { background: #4caf50; color: white; }
.review { background: #9c27b0; color: white; }

#result {
  text-align: center;
  font-weight: bold;
  margin-top: 20px;
  font-size: 18px;
}

#homeBtn {
  display: none;
  margin-top: 15px;
  background: #2196F3;
}
  /* MOBILE FIX */
  
@media (max-width: 768px) {


body {
padding: 10px;
}

.main {
padding: 15px;
box-sizing: border-box;
}

.buttons {
flex-direction: column;
gap: 8px;
}

.buttons button {
width: 100%;
box-sizing: border-box;
}



  .container {
    flex-direction: column;
  }

  .main {
    order: 1;
    width: 100%;
  }

  .sidebar {
    order: 2;
    width: 100%;
    grid-template-columns: repeat(6, 1fr);
    justify-content: center;
    max-height: none;
    border-left: none;
    border-top: 1px solid #ddd;
    padding: 10px 5px;
  }

  .sidebar button {
    width: 100%;
    height: 40px;
    font-size: 14px;
  }

  .buttons {
    flex-direction: column;
  }

  .buttons button {
    width: 100%;
  }

  #timer {
    text-align: center;
  }
  

}
</style>
</head>

<body>

<div class="container">

<div class="main">
  <div id="timer">Time Left: 60:00</div>
  <div class="question" id="question"></div>
  <div class="options" id="options"></div>

  <div class="buttons">
    <button onclick="prevQuestion()">Previous</button>
    <button onclick="saveNext()">Save & Next</button>
    <button class="review-btn" onclick="markReview()">Mark for Review</button>
    <button onclick="finishTest()">Finish Test</button>
  </div>

  <button id="homeBtn" onclick="goHome()">Go To Home Page</button>

  <div id="result"></div>
</div>

<div class="sidebar" id="questionNumbers"></div>

</div>

<script>

const questions = [
  {q:"Which of the following is a pointing device?", options:["Joystick","Keyboard","Monitor","Printer"], answer:0},
  {q:"Which software is used to create slideshows?", options:["MS Excel","MS Word","MS PowerPoint","MS Access"], answer:2},
  {q:"Which memory is volatile?", options:["ROM","RAM","Hard Disk","Flash Drive"], answer:1},
  {q:"Which protocol is used for web browsing?", options:["HTTP","FTP","SMTP","POP3"], answer:0},
  {q:"Which is an output device?", options:["Keyboard","Mouse","Printer","Scanner"], answer:2},
  {q:"Which shortcut key is used to open a file in Windows?", options:["Ctrl + O","Ctrl + N","Ctrl + S","Ctrl + P"], answer:0},
  {q:"Which spreadsheet function is used for summation?", options:["SUM","AVERAGE","MAX","MIN"], answer:0},
  {q:"Which type of network covers a large geographical area?", options:["LAN","WAN","PAN","MAN"], answer:1},
  {q:"Which key combination is used to cut text?", options:["Ctrl + X","Ctrl + C","Ctrl + V","Ctrl + Z"], answer:0},
  {q:"Which device is used to convert digital signals to analog?", options:["Modem","Router","Switch","Hub"], answer:0},
  {q:"Which one is used for video calls?", options:["Zoom","MS Word","Excel","PowerPoint"], answer:0},
  {q:"Which of the following is used to store permanent data?", options:["RAM","Hard Disk","Cache","Registers"], answer:1},
  {q:"Which software is used for data analysis?", options:["MS Word","MS Excel","MS PowerPoint","Paint"], answer:1},
  {q:"Which is a type of malware?", options:["Spyware","Mouse","Keyboard","Monitor"], answer:0},
  {q:"Which is the most common file format for PowerPoint?", options:[".pptx",".docx",".xlsx",".txt"], answer:0},
  {q:"Which key combination is used to redo an action?", options:["Ctrl + Y","Ctrl + Z","Ctrl + X","Ctrl + C"], answer:0},
  {q:"Which device is used to display images on screen?", options:["Monitor","Keyboard","Mouse","Scanner"], answer:0},
  {q:"Which one is used to compress folders?", options:["WinZip","MS Word","MS Excel","PowerPoint"], answer:0},
  {q:"Which protocol is used for email retrieval?", options:["POP3","HTTP","FTP","SMTP"], answer:0},
  {q:"Which device is used to read printed text into a computer?", options:["Scanner","Monitor","Keyboard","Mouse"], answer:0},
  {q:"Which wireless standard is widely used in Wi-Fi?", options:["IEEE 802.11","IEEE 802.3","IEEE 802.5","IEEE 802.15"], answer:0},
  {q:"Which key combination is used to save a document?", options:["Ctrl + S","Ctrl + P","Ctrl + C","Ctrl + V"], answer:0},
  {q:"Which shortcut key is used to select all cells in Excel?", options:["Ctrl + S","Ctrl + A","Ctrl + P","Ctrl + V"], answer:1},
  {q:"Which operating system is used in most PCs?", options:["Windows","Android","Linux","iOS"], answer:0},
  {q:"Which software can create graphs from data?", options:["MS Excel","MS Word","MS PowerPoint","Paint"], answer:0},
  {q:"Which of the following is a secondary storage?", options:["CD/DVD","RAM","Cache","Registers"], answer:0},
  {q:"Which key is used to delete selected content?", options:["Delete","Backspace","Enter","Esc"], answer:0},
  {q:"Which protocol is used to send emails securely?", options:["SMTP with SSL","HTTP","FTP","POP3"], answer:0},
  {q:"Which device connects multiple devices in a network?", options:["Switch","Keyboard","Monitor","Printer"], answer:0},
  {q:"Which of these is used to prevent unauthorized access?", options:["Password","Paint","MS Word","Excel"], answer:0},
  {q:"Which one is used to open the context menu?", options:["Right-click","Left-click","Double-click","Scroll"], answer:0},
  {q:"Which is the full form of URL?", options:["Uniform Resource Locator","Universal Resource Locator","Unified Resource Link","Unique Resource Link"], answer:0},
  {q:"Which of the following is used for video conferencing?", options:["Zoom","MS Word","Excel","Paint"], answer:0},
  {q:"Which of the following is an Internet browser?", options:["Mozilla Firefox","MS Word","Excel","Paint"], answer:0},
  {q:"Which key is used to cancel an operation?", options:["Esc","Enter","Shift","Ctrl"], answer:0},
  {q:"Which one is a type of cloud storage?", options:["OneDrive","MS Word","Excel","PowerPoint"], answer:0},
  {q:"Which software allows email management?", options:["MS Outlook","MS Excel","MS Word","Paint"], answer:0},
  {q:"Which one is used to create tables in Word?", options:["Insert > Table","Home > Table","Format > Table","View > Table"], answer:0},
  {q:"Which of these stores data temporarily?", options:["RAM","Hard Disk","CD","DVD"], answer:0},
  {q:"Which key is used to start a new line in Word?", options:["Enter","Ctrl","Shift","Alt"], answer:0},
  {q:"Which one is used to protect against viruses?", options:["Antivirus","MS Word","MS Excel","PowerPoint"], answer:0},
  {q:"Which of the following is a part of CPU?", options:["ALU","Control Unit","Registers","All of the above"], answer:3},
  {q:"Which shortcut key is used to print a document?", options:["Ctrl + P","Ctrl + S","Ctrl + C","Ctrl + V"], answer:0},
  {q:"Which of the following is used to create presentations?", options:["MS PowerPoint","MS Word","MS Excel","Paint"], answer:0},
  {q:"Which of the following is used to view source code of a webpage?", options:["Ctrl + U","Right-click > View Page Source","View > Source","All of the above"], answer:3},
  {q:"Which of the following is used to refresh a webpage?", options:["F5","Ctrl + R","Both a and b","None"], answer:2},
  {q:"Which one is a protocol for secure web browsing?", options:["HTTPS","HTTP","FTP","SMTP"], answer:0},
  {q:"Which software is used for storing large amounts of data?", options:["MS Access","MS Word","MS Excel","Paint"], answer:0},
  {q:"Which of the following is used to compress files?", options:["7-Zip","MS Word","Excel","PowerPoint"], answer:0},
  {q:"Which key is used to undo typing in Word?", options:["Ctrl + Z","Ctrl + Y","Ctrl + X","Ctrl + C"], answer:0}
  
];


// VARIABLES
let current = 0;
let userAnswers = new Array(questions.length);
let questionStatus = new Array(questions.length).fill("not-visited");
let timeLeft = 60 * 60;
let timerInterval;

// SIDEBAR
function loadSidebar() {
  const sb = document.getElementById("questionNumbers");
  sb.innerHTML = "";
  questions.forEach((_, i) => {
    let btn = document.createElement("button");
    btn.innerText = i + 1;
    btn.id = "qBtn" + i;
    btn.onclick = () => { current = i; loadQuestion(); };
    sb.appendChild(btn);
  });
}

// LOAD QUESTION
function loadQuestion() {
  const q = questions[current];
  document.getElementById("question").innerText = (current+1)+". "+q.q;

  let optionsHTML="";
  q.options.forEach((opt,i)=>{
    optionsHTML+=`
    <label>
      <input type="radio" name="option" value="${i}"
      ${userAnswers[current]==i?"checked":""}
      onclick="selectOption(${i})">
      ${opt}
    </label>`;
  });

  document.getElementById("options").innerHTML=optionsHTML;

  if(questionStatus[current]=="not-visited")
    questionStatus[current]="visited";

  updateSidebar();
}

// SELECT OPTION
function selectOption(i){
  userAnswers[current]=i;
}

// SAVE NEXT
function saveNext(){
  if(userAnswers[current]!=undefined)
    questionStatus[current]="answered";
  nextQuestion();
}

// REVIEW
function markReview(){
  questionStatus[current]="review";
  nextQuestion();
}

function nextQuestion(){
  if(current<questions.length-1){
    current++;
    loadQuestion();
  }
}

function prevQuestion(){
  if(current>0){
    current--;
    loadQuestion();
  }
}

// UPDATE SIDEBAR
function updateSidebar(){
  questions.forEach((_,i)=>{
    const btn=document.getElementById("qBtn"+i);
    btn.className="";
    btn.classList.add(questionStatus[i]);
  });
}

// FINISH TEST

  clearInterval(timerInterval); // STOP TIMER

  let score=0;

  document.getElementById("result").innerText =
  "✅ Test Finished | Score: "+score+" / "+questions.length;

  // Disable all inputs
  document.querySelectorAll("input").forEach(inp=>inp.disabled=true);
  document.querySelectorAll(".buttons button").forEach(btn=>btn.disabled=true);

  document.getElementById("homeBtn").style.display="inline-block";
} */

 function finishTest(){

  clearInterval(timerInterval); // STOP TIMER

  let correct = 0;
  let wrong = 0;
  let attempted = 0;
  let notAttempted = 0;

  let wrongQuestionsHTML = "";

  questions.forEach((q, i) => {

    if(userAnswers[i] === undefined){
      notAttempted++;
    } else {
      attempted++;
      if(userAnswers[i] === q.answer){
        correct++;
      } else {
        wrong++;

        wrongQuestionsHTML += `
        <div style="margin-bottom:15px; padding:10px; border:1px solid #ddd; border-radius:6px;">
          <strong>Q${i+1}. ${q.q}</strong><br>
          ❌ Your Answer: ${q.options[userAnswers[i]]}<br>
          ✅ Correct Answer: ${q.options[q.answer]}
        </div>`;
      }
    }

  });

  let percentage = ((correct / questions.length) * 100).toFixed(2);

  document.getElementById("result").innerHTML = `
  <div style="text-align:left;">
    <h3>✅ Test Finished</h3>
    <p><strong>Total Questions:</strong> ${questions.length}</p>
    <p><strong>Attempted:</strong> ${attempted}</p>
    <p><strong>Not Attempted:</strong> ${notAttempted}</p>
    <p><strong>Correct:</strong> ${correct}</p>
    <p><strong>Wrong:</strong> ${wrong}</p>
    <p><strong>Percentage:</strong> ${percentage}%</p>
    <hr>
    <h3>❌ Wrong Questions Detail</h3>
    ${wrongQuestionsHTML || "🎉 No Wrong Answers! Excellent Work!"}
  </div>
  `;

  // Disable inputs
  document.querySelectorAll("input").forEach(inp=>inp.disabled=true);
  document.querySelectorAll(".buttons button").forEach(btn=>btn.disabled=true);

  document.getElementById("homeBtn").style.display="inline-block";
}

// TIMER
function startTimer(){
  timerInterval=setInterval(()=>{
    if(timeLeft<=0){
      clearInterval(timerInterval);
      finishTest();
      return;
    }
    let m=Math.floor(timeLeft/60);
    let s=timeLeft%60;
    document.getElementById("timer").innerText=
    `Time Left: ${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
    timeLeft--;
  },1000);
}

// HOME BUTTON
function goHome(){
  window.location.href="https://pcbpcm.in/ccc/";
}

// INIT
loadSidebar();
loadQuestion();
startTimer();

</script>

</body>
</html>
