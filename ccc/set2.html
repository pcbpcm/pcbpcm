<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>50 Question Online MCQ Test with Review</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #eef2f7;
  display: flex;
  justify-content: center;
  padding: 20px;
}

.container {
  display: flex;
  width: 950px;
  max-width: 100%;
  background: white;
  border-radius: 12px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.1);
  overflow: hidden;
  flex-wrap: nowrap; /* keep sidebar on right */
}

.main {
  flex: 1;
  padding: 25px;
  position: relative;
  min-width: 300px;
}

#timer {
  text-align: right;
  font-weight: bold;
  color: red;
  font-size: 18px;
}

.question {
  margin: 20px 0;
  font-size: 18px;
}

.options label {
  display: block;
  margin: 8px 0;
  padding: 6px;
  border-radius: 6px;
  cursor: pointer;
  border: 1px solid #ddd;
}

.options label.correct {
  background: #c8e6c9;
  border-color: #4caf50;
}

.options label.wrong {
  background: #ffcdd2;
  border-color: #f44336;
}

.buttons {
  margin-top: 20px;
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

button.action-btn {
  padding: 8px 15px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  background: #4CAF50;
  color: white;
}

button.action-btn:hover {
  background: #45a049;
}

button.review-btn {
  background: #9c27b0;
}

button.review-btn:hover {
  background: #7b1fa2;
}

/* Sidebar on the right */
.sidebar {
  width: 200px;
  background: #f5f5f5;
  padding: 10px;
  border-left: 1px solid #ddd;
  display: grid;
  grid-template-columns: repeat(4, 40px);
  gap: 8px;
  max-height: 650px;
  overflow-y: auto;
  order: 1; /* ensure it stays on the right */
}

.sidebar button {
  width: 40px;
  height: 40px;
  border-radius: 6px;
  border: 1px solid #aaa;
  cursor: pointer;
  background: #fff;
  font-weight: bold;
}

.sidebar button.not-visited {
  background: #fff;
  color: black;
}

.sidebar button.visited {
  background: #f44336; /* red */
  color: white;
}

.sidebar button.answered {
  background: #4caf50; /* green */
  color: white;
}

.sidebar button.review {
  background: #9c27b0; /* purple */
  color: white;
}

.sidebar button.review-answered::after {
  content: "✔️";
  font-size: 12px;
  margin-left: 2px;
}

#result {
  text-align: center;
  font-weight: bold;
  margin-top: 15px;
  font-size: 18px;
}

/* Mobile responsiveness */
@media screen and (max-width: 800px) {
  .container {
    flex-direction: column; /* stack sidebar below on small screens */
  }
  .sidebar {
    width: 100%;
    grid-template-columns: repeat(8, 30px);
    margin-top: 15px;
  }
}
</style>
</head>
<body>

<div class="container">
  <!-- Main area -->
  <div class="main">
    <div id="timer">Time Left: 60:00</div>
    <div class="question" id="question"></div>
    <div class="options" id="options"></div>

    <div class="buttons">
      <button class="action-btn" onclick="prevQuestion()">Previous</button>
      <button class="action-btn" onclick="saveNext()">Save & Next</button>
      <button class="review-btn" onclick="markReview()">Mark for Review</button>
      <button class="action-btn" onclick="finishTest()">Finish</button>
    </div>

    <div id="result"></div>
  </div>

  <!-- Sidebar -->
  <div class="sidebar" id="questionNumbers"></div>
</div>

<script>
// Your 50 questions array remains the same
// ... (same as previous code)

const questions = [
  {q:"Which of the following is the brain of the computer?", options:["RAM","CPU","Hard Disk","Monitor"], answer:0},
  {q:"Which is a non-volatile memory?", options:["RAM","ROM","Cache","Registers"], answer:1},
  {q:"Which of the following is an input device?", options:["Keyboard","Monitor","Printer","Speaker"], answer:0},
  {q:"Which of the following is an output device?", options:["Mouse","Monitor","Keyboard","Scanner"], answer:1},
  {q:"Which of the following is used to store large amounts of data permanently?", options:["RAM","Hard Disk","Cache","CPU"], answer:1},
  {q:"Which software is used to browse the Internet?", options:["MS Word","Browser","MS Excel","MS PowerPoint"], answer:1},
  {q:"Which of the following is a type of computer network?", options:["LAN","WAN","MAN","All of the above"], answer:3},
  {q:"Which one is used for email communication?", options:["MS Excel","MS Word","MS Outlook","Notepad"], answer:2},
  {q:"Which of the following is an operating system?", options:["Windows","MS Word","Excel","PowerPoint"], answer:0},
  {q:"Which of the following is used to perform calculations in MS Excel?", options:["Cell","Formula","Table","Graph"], answer:1},
  {q:"What is the shortcut key for Copy in Windows?", options:["Ctrl + C","Ctrl + V","Ctrl + X","Ctrl + P"], answer:0},
  {q:"What is the shortcut key for Paste in Windows?", options:["Ctrl + P","Ctrl + V","Ctrl + C","Ctrl + X"], answer:1},
  {q:"Which key is used to delete a character before the cursor?", options:["Delete","Backspace","Esc","Enter"], answer:1},
  {q:"Which one is used to protect a computer from viruses?", options:["Firewall","Antivirus","Disk Cleanup","Notepad"], answer:1},
  {q:"What is the full form of HTTP?", options:["HyperText Transfer Protocol","HighText Transfer Protocol","HyperText Transmission Program","None of the above"], answer:0},
  {q:"Which of the following is a spreadsheet software?", options:["MS Word","MS Excel","MS PowerPoint","MS Access"], answer:1},
  {q:"Which of the following is used to create presentations?", options:["MS Word","MS Excel","MS PowerPoint","MS Access"], answer:2},
  {q:"Which of the following is an example of an email provider?", options:["Gmail","Yahoo Mail","Outlook","All of the above"], answer:3},
  {q:"Which is used to store temporary data for fast processing?", options:["RAM","ROM","Hard Disk","Flash Drive"], answer:0},
  {q:"Which of the following is a type of malware?", options:["Virus","Worm","Trojan","All of the above"], answer:3},
  {q:"Which is the most common file format for MS Word?", options:[".xls",".ppt",".doc/.docx",".txt"], answer:2},
  {q:"Which is the most common file format for MS Excel?", options:[".doc",".xls/.xlsx",".ppt",".txt"], answer:1},
  {q:"Which is the most common file format for MS PowerPoint?", options:[".ppt/.pptx",".xls",".doc",".txt"], answer:0},
  {q:"Which of the following is a search engine?", options:["Google","Yahoo","Bing","All of the above"], answer:3},
  {q:"Which of the following is used to present data graphically in Excel?", options:["Chart","Table","Cell","Formula"], answer:0},
  {q:"What is the extension of Notepad files?", options:[".txt",".doc",".xls",".ppt"], answer:0},
  {q:"Which is a wireless communication technology?", options:["LAN","Wi-Fi","Ethernet","Cable"], answer:1},
  {q:"Which one is used to format a text in Word?", options:["Font","Bold","Italic","All of the above"], answer:3},
  {q:"Which key combination is used to undo an action?", options:["Ctrl + Z","Ctrl + Y","Ctrl + X","Ctrl + C"], answer:0},
  {q:"Which key combination is used to redo an action?", options:["Ctrl + Z","Ctrl + Y","Ctrl + X","Ctrl + C"], answer:1},
  {q:"Which is the shortcut key to select all text?", options:["Ctrl + S","Ctrl + A","Ctrl + P","Ctrl + V"], answer:1},
  {q:"Which of the following is used to send messages in real-time?", options:["Email","Instant Messaging","Word Document","PowerPoint"], answer:1},
  {q:"Which one is used for database management?", options:["MS Word","MS Excel","MS Access","MS PowerPoint"], answer:2},
  {q:"Which of the following is a part of the CPU?", options:["ALU","Control Unit","Registers","All of the above"], answer:3},
  {q:"Which of the following is a secondary storage device?", options:["RAM","Hard Disk","Cache","Register"], answer:1},
  {q:"Which of the following is not a browser?", options:["Google Chrome","Mozilla Firefox","MS Word","Microsoft Edge"], answer:2},
  {q:"Which key combination is used to open a new document in MS Word?", options:["Ctrl + N","Ctrl + O","Ctrl + S","Ctrl + P"], answer:0},
  {q:"Which one is used to send an email?", options:["Gmail","Outlook","Yahoo Mail","All of the above"], answer:3},
  {q:"Which of the following is used to protect data from unauthorized access?", options:["Password","Antivirus","Firewall","Cache"], answer:0},
  {q:"Which device is used to connect computers in a network?", options:["Router","Printer","Scanner","Keyboard"], answer:0},
  {q:"Which of the following is a cloud storage service?", options:["Google Drive","OneDrive","Dropbox","All of the above"], answer:3},
  {q:"What does GUI stand for?", options:["Graphical User Interface","General User Interaction","Graphical Utility Input","General Utility Interface"], answer:0},
  {q:"Which of the following is a presentation layout in PowerPoint?", options:["Title Slide","Content Slide","Blank Slide","All of the above"], answer:3},
  {q:"Which of the following is a type of computer virus?", options:["Macro Virus","Boot Virus","File Infector","All of the above"], answer:3},
  {q:"Which of the following is used to organize emails?", options:["Folders","Labels","Categories","All of the above"], answer:3},
  {q:"Which of the following is a mobile operating system?", options:["Android","Windows","Linux","MS DOS"], answer:1},
  {q:"Which is used to create tables in MS Word?", options:["Insert > Table","Home > Table","Format > Table","View > Table"], answer:0},
  {q:"Which of the following is used to view webpage source code?", options:["View > Source","Ctrl + U","Right-click > View Page Source","All of the above"], answer:3},
  {q:"Which of the following is used to refresh a webpage?", options:["F5","Ctrl + R","Both a and b","None"], answer:2},
  {q:"Which one is used to compress files?", options:["WinRAR","7-Zip","WinZip","All of the above"], answer:3},
];


// Status tracking
let current = 0;
let userAnswers = new Array(questions.length);
let questionStatus = new Array(questions.length).fill("not-visited");
let timeLeft = 60 * 60; // 60 minutes

function loadSidebar() {
  const sb = document.getElementById("questionNumbers");
  sb.innerHTML = "";
  questions.forEach((_, i) => {
    let btn = document.createElement("button");
    btn.innerText = i + 1;
    btn.id = "qBtn" + i;
    btn.onclick = () => { current = i; loadQuestion(); };
    sb.appendChild(btn);
  });
}

function loadQuestion() {
  const q = questions[current];
  document.getElementById("question").innerText = (current + 1) + ". " + q.q;

  let optionsHTML = "";
  q.options.forEach((opt, i) => {
    optionsHTML += `
      <label id="label${i}">
        <input type="radio" name="option" value="${i}" onclick="selectOption(${i})"
        ${userAnswers[current] == i ? "checked" : ""}>
        ${opt}
      </label>
    `;
  });
  document.getElementById("options").innerHTML = optionsHTML;

  if(questionStatus[current] === "not-visited") questionStatus[current] = "visited";
  updateSidebar();
}

function selectOption(i) {
  userAnswers[current] = i;
  questions[current].options.forEach((_, idx) => {
    const label = document.getElementById("label" + idx);
    label.classList.remove("correct","wrong");
    if(idx===i && idx===questions[current].answer) label.classList.add("correct");
    if(idx===i && idx!==questions[current].answer) label.classList.add("wrong");
  });
}

function saveNext() {
  if(userAnswers[current] !== undefined){
    if(questionStatus[current]==="review") questionStatus[current] = "review-answered";
    else questionStatus[current] = "answered";
  } else if(questionStatus[current]!=="review-answered"){
    questionStatus[current] = "visited";
  }
  nextQuestion();
}

function markReview() {
  if(userAnswers[current] !== undefined) questionStatus[current] = "review-answered";
  else questionStatus[current] = "review";
  nextQuestion();
}

function nextQuestion() { if(current < questions.length-1) { current++; loadQuestion(); } }
function prevQuestion() { if(current > 0) { current--; loadQuestion(); } }

function updateSidebar() {
  questions.forEach((_, i)=>{
    const btn = document.getElementById("qBtn"+i);
    btn.className="";
    switch(questionStatus[i]){
      case "not-visited": btn.classList.add("not-visited"); break;
      case "visited": btn.classList.add("visited"); break;
      case "answered": btn.classList.add("answered"); break;
      case "review": btn.classList.add("review"); break;
      case "review-answered": btn.classList.add("review","review-answered"); break;
    }
  });
}

function finishTest(){
  let score=0;
  userAnswers.forEach((ans,i)=>{ if(ans===questions[i].answer) score++; });
  document.getElementById("result").innerText = "Final Score: "+score+" / "+questions.length;
}

function startTimer(){
  const timerInterval = setInterval(()=>{
    if(timeLeft <= 0){
      clearInterval(timerInterval);
      finishTest();
      return;
    }
    let minutes = Math.floor(timeLeft / 60);
    let seconds = timeLeft % 60;
    document.getElementById("timer").innerText = `Time Left: ${minutes.toString().padStart(2,'0')}:${seconds.toString().padStart(2,'0')}`;
    timeLeft--;
  }, 1000);
}

// Initialize
loadSidebar();
loadQuestion();
startTimer();
</script>

</body>
</html>
