// VARIABLES
let current = 0;
let userAnswers = new Array(questions.length);
let questionStatus = new Array(questions.length).fill("not-visited");
let timeLeft = 90 * 60;
let timerInterval;

// SIDEBAR
function loadSidebar() {
  const sb = document.getElementById("questionNumbers");
  sb.innerHTML = "";
  questions.forEach((_, i) => {
    let btn = document.createElement("button");
    btn.innerText = i + 1;
    btn.id = "qBtn" + i;
    btn.onclick = () => { current = i; loadQuestion(); };
    sb.appendChild(btn);
  });
}

// LOAD QUESTION
function loadQuestion() {
  const q = questions[current];
  document.getElementById("question").innerText = (current+1)+". "+q.q;

  let optionsHTML="";
  q.options.forEach((opt,i)=>{
    optionsHTML+=`
    <label>
      <input type="radio" name="option" value="${i}"
      ${userAnswers[current]==i?"checked":""}
      onclick="selectOption(${i})">
      ${opt}
    </label>`;
  });

  document.getElementById("options").innerHTML=optionsHTML;

  if(questionStatus[current]=="not-visited")
    questionStatus[current]="visited";

  updateSidebar();
}

// SELECT OPTION
function selectOption(i){
  userAnswers[current]=i;
}

// SAVE NEXT
function saveNext(){
  if(userAnswers[current]!=undefined)
    questionStatus[current]="answered";
  nextQuestion();
}

// REVIEW
function markReview(){
  questionStatus[current]="review";
  nextQuestion();
}

function nextQuestion(){
  if(current<questions.length-1){
    current++;
    loadQuestion();
  }
}

function prevQuestion(){
  if(current>0){
    current--;
    loadQuestion();
  }
}

// UPDATE SIDEBAR
function updateSidebar(){
  questions.forEach((_,i)=>{
    const btn=document.getElementById("qBtn"+i);
    btn.className="";
    btn.classList.add(questionStatus[i]);
  });
}

function finishTest(){

  clearInterval(timerInterval); // STOP TIMER

  let correct = 0;
  let wrong = 0;
  let attempted = 0;
  let notAttempted = 0;

  let wrongQuestionsHTML = "";

  questions.forEach((q, i) => {

    if(userAnswers[i] === undefined){
      notAttempted++;
    } else {
      attempted++;
      if(userAnswers[i] === q.answer){
        correct++;
      } else {
        wrong++;

        wrongQuestionsHTML += `
        <div style="margin-bottom:15px; padding:10px; border:1px solid #ddd; border-radius:6px;">
          <strong>Q${i+1}. ${q.q}</strong><br>
          ❌ Your Answer: <span style="color:red;">${q.options[userAnswers[i]]}</span><br>
          ✅ Correct Answer: <span style="color:green;">${q.options[q.answer]}</span>
        </div>`;
      }
    }

  });

  let percentage = ((correct / questions.length) * 100).toFixed(2);

  // 🔥 GRADE LOGIC
  let grade = "";
  let gradeColor = "";

  if (percentage >= 85) { grade = "S (Outstanding)"; gradeColor = "darkgreen"; }
  else if (percentage >= 75) { grade = "A (Very Good)"; gradeColor = "green"; }
  else if (percentage >= 65) { grade = "B (Good)"; gradeColor = "blue"; }
  else if (percentage >= 55) { grade = "C (Satisfactory)"; gradeColor = "orange"; }
  else if (percentage >= 50) { grade = "D (Pass)"; gradeColor = "brown"; }
  else { grade = "F (Fail)"; gradeColor = "red"; }

  document.getElementById("result").innerHTML = `
  <div style="text-align:left;">
    <h3 style="color:#4CAF50;">✅ Test Finished</h3>

    <p><strong>Total Questions:</strong> ${questions.length}</p>

    <p><strong>Attempted:</strong> 
      <span style="color:#2196F3; font-weight:bold;">${attempted}</span>
    </p>

    <p><strong>Not Attempted:</strong> 
      <span style="color:#ff9800; font-weight:bold;">${notAttempted}</span>
    </p>

    <p><strong>Correct:</strong> 
      <span style="color:#4CAF50; font-weight:bold;">${correct}</span>
    </p>

    <p><strong>Wrong:</strong> 
      <span style="color:#f44336; font-weight:bold;">${wrong}</span>
    </p>

    <p><strong>Marks Obtained:</strong> 
      <span style="color:#4CAF50; font-weight:bold;">${correct} / ${questions.length}</span>
    </p>

    <p><strong>Percentage:</strong> 
      <span style="color:#0d47a1; font-weight:bold;">${percentage}%</span>
    </p>

    <p><strong>Grade:</strong> 
      <span style="color:${gradeColor}; font-weight:bold; font-size:20px;">${grade}</span>
    </p>

    <hr>
    <h3 style="color:#f44336;">❌ Wrong Questions Detail</h3>
    ${wrongQuestionsHTML || "<span style='color:#4CAF50; font-weight:bold;'>🎉 No Wrong Answers!!!</span>"}
  </div>
  `;

  // Disable inputs
  document.querySelectorAll("input").forEach(inp=>inp.disabled=true);
  document.querySelectorAll(".buttons button").forEach(btn=>btn.disabled=true);

  document.getElementById("homeBtn").style.display="inline-block";
}


// TIMER
function startTimer(){
  timerInterval=setInterval(()=>{
    if(timeLeft<=0){
      clearInterval(timerInterval);
      finishTest();
      return;
    }
    let m=Math.floor(timeLeft/60);
    let s=timeLeft%60;
    document.getElementById("timer").innerText=
    `Time Left: ${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
    timeLeft--;
  },1000);
}

// HOME BUTTON
function goHome(){
  window.location.href="https://pcbpcm.in/ccc/";
}

loadQuestion();
startTimer();
