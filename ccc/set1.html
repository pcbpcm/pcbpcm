body {
  font-family: Arial, sans-serif;
  background: #eef2f7;
  display: flex;
  justify-content: center;
  padding: 20px;
}

.container {
  display: flex;
  width: 1000px;
  max-width: 100%;
  background: white;
  border-radius: 12px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.1);
  overflow: hidden;
}

.main {
  flex: 1;
  padding: 25px;
  min-width: 300px;
}

#timer {
  text-align: right;
  font-weight: bold;
  color: red;
  font-size: 18px;
}

.question {
  margin: 20px 0;
  font-size: 18px;
}

.options label {
  display: block;
  margin: 8px 0;
  padding: 6px;
  border-radius: 6px;
  cursor: pointer;
  border: 1px solid #ddd;
}

.buttons {
  margin-top: 20px;
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

button {

  border: none;
  border-radius: 6px;
  cursor: pointer;
  background: #4CAF50;
  color: white;
}

button:hover {
  opacity: 0.9;
}

.review-btn {
  background: #9c27b0;
}

.sidebar {
  width: 220px;
  background: #f5f5f5;
  padding: 10px;
  border-left: 1px solid #ddd;
  display: grid;
  grid-template-columns: repeat(4, 45px);
  gap: 8px;
  max-height: 650px;
  overflow-y: auto;
}

.sidebar button {
  width: 45px;
  height: 45px;
  font-weight: bold;
}

.not-visited { background: #fff; color: black; }
.visited { background: #f44336; color: white; }
.answered { background: #4caf50; color: white; }
.review { background: #9c27b0; color: white; }

#result {
  text-align: center;
  font-weight: bold;
  margin-top: 20px;
  font-size: 18px;
}

#homeBtn {
  display: none;
  margin-top: 15px;
  background: #2196F3;
}

@media (max-width: 768px) {

}

.buttons {

width: 100%;

// VARIABLES
let current = 0;
let userAnswers = new Array(questions.length);
let questionStatus = new Array(questions.length).fill("not-visited");
let timeLeft = 60 * 60;
let timerInterval;

// SIDEBAR
function loadSidebar() {
  const sb = document.getElementById("questionNumbers");
  sb.innerHTML = "";
  questions.forEach((_, i) => {
    let btn = document.createElement("button");
    btn.innerText = i + 1;
    btn.id = "qBtn" + i;
    btn.onclick = () => { current = i; loadQuestion(); };
    sb.appendChild(btn);
  });
}

// LOAD QUESTION
function loadQuestion() {
  const q = questions[current];
  document.getElementById("question").innerText = (current+1)+". "+q.q;

  let optionsHTML="";
  q.options.forEach((opt,i)=>{
    optionsHTML+=`
    <label>
      <input type="radio" name="option" value="${i}"
      ${userAnswers[current]==i?"checked":""}
      onclick="selectOption(${i})">
      ${opt}
    </label>`;
  });

  document.getElementById("options").innerHTML=optionsHTML;

  if(questionStatus[current]=="not-visited")
    questionStatus[current]="visited";

  updateSidebar();
}

// SELECT OPTION
function selectOption(i){
  userAnswers[current]=i;
}

// SAVE NEXT
function saveNext(){
  if(userAnswers[current]!=undefined)
    questionStatus[current]="answered";
  nextQuestion();
}

// REVIEW
function markReview(){
  questionStatus[current]="review";
  nextQuestion();
}

function nextQuestion(){
  if(current<questions.length-1){
    current++;
    loadQuestion();
  }
}

function prevQuestion(){
  if(current>0){
    current--;
    loadQuestion();
  }
}

// UPDATE SIDEBAR
function updateSidebar(){
  questions.forEach((_,i)=>{
    const btn=document.getElementById("qBtn"+i);
    btn.className="";
    btn.classList.add(questionStatus[i]);
  });
}

 function finishTest(){

  clearInterval(timerInterval); // STOP TIMER

  let correct = 0;
  let wrong = 0;
  let attempted = 0;
  let notAttempted = 0;

  let wrongQuestionsHTML = "";

  questions.forEach((q, i) => {

    if(userAnswers[i] === undefined){
      notAttempted++;
    } else {
      attempted++;
      if(userAnswers[i] === q.answer){
        correct++;
      } else {
        wrong++;

        wrongQuestionsHTML += `
        <div style="margin-bottom:15px; padding:10px; border:1px solid #ddd; border-radius:6px;">
          <strong>Q${i+1}. ${q.q}</strong><br>
          ❌ Your Answer: ${q.options[userAnswers[i]]}<br>
          ✅ Correct Answer: ${q.options[q.answer]}
        </div>`;
      }
    }

  });

  let percentage = ((correct / questions.length) * 100).toFixed(2);

  document.getElementById("result").innerHTML = `
  <div style="text-align:left;">
    <h3>✅ Test Finished</h3>
    <p><strong>Total Questions:</strong> ${questions.length}</p>
    <p><strong>Attempted:</strong> ${attempted}</p>
    <p><strong>Not Attempted:</strong> ${notAttempted}</p>
    <p><strong>Correct:</strong> ${correct}</p>
    <p><strong>Wrong:</strong> ${wrong}</p>
    <p><strong>Percentage:</strong> ${percentage}%</p>
    <hr>
    <h3>❌ Wrong Questions Detail</h3>
    ${wrongQuestionsHTML || "🎉 No Wrong Answers! Excellent Work!"}
  </div>
  `;

  // Disable inputs
  document.querySelectorAll("input").forEach(inp=>inp.disabled=true);
  document.querySelectorAll(".buttons button").forEach(btn=>btn.disabled=true);

  document.getElementById("homeBtn").style.display="inline-block";
}

// TIMER
function startTimer(){
  timerInterval=setInterval(()=>{
    if(timeLeft<=0){
      clearInterval(timerInterval);
      finishTest();
      return;
    }
    let m=Math.floor(timeLeft/60);
    let s=timeLeft%60;
    document.getElementById("timer").innerText=
    `Time Left: ${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
    timeLeft--;
  },1000);
}

// HOME BUTTON
function goHome(){
  window.location.href="https://pcbpcm.in/ccc/";
}
