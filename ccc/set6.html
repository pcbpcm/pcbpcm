<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Online MCQ Test</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #eef2f7;
  display: flex;
  justify-content: center;
  padding: 20px;
}

.container {
  display: flex;
  width: 1000px;
  max-width: 100%;
  background: white;
  border-radius: 12px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.1);
  overflow: hidden;
}

.main {
  flex: 1;
  padding: 25px;
  min-width: 300px;
}

#timer {
  text-align: right;
  font-weight: bold;
  color: red;
  font-size: 18px;
}

.question {
  margin: 20px 0;
  font-size: 18px;
}

.options label {
  display: block;
  margin: 8px 0;
  padding: 6px;
  border-radius: 6px;
  cursor: pointer;
  border: 1px solid #ddd;
}

.buttons {
  margin-top: 20px;
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

button {
  padding: 8px 15px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  background: #4CAF50;
  color: white;
}

button:hover {
  opacity: 0.9;
}

.review-btn {
  background: #9c27b0;
}

.sidebar {
  width: 220px;
  background: #f5f5f5;
  padding: 10px;
  border-left: 1px solid #ddd;
  display: grid;
  grid-template-columns: repeat(4, 45px);
  gap: 8px;
  max-height: 650px;
  overflow-y: auto;
}

.sidebar button {
  width: 45px;
  height: 45px;
  font-weight: bold;
}

.not-visited { background: #fff; color: black; }
.visited { background: #f44336; color: white; }
.answered { background: #4caf50; color: white; }
.review { background: #9c27b0; color: white; }

#result {
  text-align: center;
  font-weight: bold;
  margin-top: 20px;
  font-size: 18px;
}

#homeBtn {
  display: none;
  margin-top: 15px;
  background: #2196F3;
}
</style>
</head>

<body>

<div class="container">

<div class="main">
  <div id="timer">Time Left: 60:00</div>
  <div class="question" id="question"></div>
  <div class="options" id="options"></div>

  <div class="buttons">
    <button onclick="prevQuestion()">Previous</button>
    <button onclick="saveNext()">Save & Next</button>
    <button class="review-btn" onclick="markReview()">Mark for Review</button>
    <button onclick="finishTest()">Finish Test</button>
  </div>

  <button id="homeBtn" onclick="goHome()">Go To Home Page</button>

  <div id="result"></div>
</div>

<div class="sidebar" id="questionNumbers"></div>

</div>

<script>

const questions  = [
  {q:"Which of the following is used to block unwanted network traffic?", options:["Firewall","Antivirus","Router","Switch"], answer:0},
  {q:"Which key combination is used to open Task Manager?", options:["Ctrl + Shift + Esc","Alt + F4","Ctrl + C","Ctrl + V"], answer:0},
  {q:"Which device is used to read data from CDs or DVDs?", options:["Optical Drive","Hard Disk","Monitor","Keyboard"], answer:0},
  {q:"Which of the following is a vector graphics software?", options:["CorelDRAW","MS Paint","MS Word","MS Excel"], answer:0},
  {q:"Which shortcut key is used to save a document?", options:["Ctrl + S","Ctrl + C","Ctrl + V","Ctrl + Z"], answer:0},
  {q:"Which protocol is used to send email?", options:["SMTP","HTTP","FTP","POP3"], answer:0},
  {q:"Which one is used to manage contacts in email?", options:["Address Book","Calendar","Inbox","Outbox"], answer:0},
  {q:"Which of the following is a file compression software?", options:["WinZip","MS Word","MS Excel","Paint"], answer:0},
  {q:"Which key is used to move the cursor to the beginning of a line?", options:["Home","End","Page Up","Page Down"], answer:0},
  {q:"Which device is used to input handwriting into a computer?", options:["Graphics Tablet","Keyboard","Mouse","Scanner"], answer:0},
  {q:"Which is used to create animations in presentations?", options:["PowerPoint","MS Word","MS Excel","Paint"], answer:0},
  {q:"Which key combination is used to open the Replace dialog in Word?", options:["Ctrl + H","Ctrl + F","Ctrl + S","Ctrl + P"], answer:0},
  {q:"Which of the following is used for digital signature?", options:["Cryptography","MS Word","MS Excel","MS PowerPoint"], answer:0},
  {q:"Which device is used to convert sound into digital signals?", options:["Microphone","Speaker","Monitor","Printer"], answer:0},
  {q:"Which software is used to design websites visually?", options:["Adobe Dreamweaver","MS Word","MS Excel","Paint"], answer:0},
  {q:"Which of the following is an email protocol to fetch emails?", options:["IMAP","HTTP","FTP","SMTP"], answer:0},
  {q:"Which key is used to move the cursor one word to the left?", options:["Ctrl + Left Arrow","Ctrl + Right Arrow","Shift + Left Arrow","Alt + Left Arrow"], answer:0},
  {q:"Which of these is a type of malware that locks files for ransom?", options:["Ransomware","Virus","Trojan","Spyware"], answer:0},
  {q:"Which of the following is used to edit photos?", options:["Adobe Photoshop","MS Word","MS Excel","PowerPoint"], answer:0},
  {q:"Which key combination is used to select multiple items?", options:["Ctrl + Click","Shift + Click","Alt + Click","Ctrl + Alt + Click"], answer:0},
  {q:"Which device connects a computer to a telephone line?", options:["Modem","Router","Switch","Printer"], answer:0},
  {q:"Which software is used to create slideshows with animations?", options:["PowerPoint","MS Word","MS Excel","Paint"], answer:0},
  {q:"Which key is used to move the cursor to the end of a document?", options:["Ctrl + End","Ctrl + Home","Page Up","Page Down"], answer:0},
  {q:"Which of the following is a presentation theme feature?", options:["Design","Home","Insert","View"], answer:0},
  {q:"Which protocol is used for web page transfer?", options:["HTTP","FTP","SMTP","POP3"], answer:0},
  {q:"Which device is used to convert digital signals to analog signals?", options:["Modem","Router","Printer","Monitor"], answer:0},
  {q:"Which shortcut is used to open a new tab in a browser?", options:["Ctrl + T","Ctrl + N","Ctrl + W","Ctrl + S"], answer:0},
  {q:"Which of the following stores user preferences in Windows?", options:["Registry","Cache","RAM","ROM"], answer:0},
  {q:"Which software is used to create and manage spreadsheets?", options:["MS Excel","MS Word","MS PowerPoint","MS Access"], answer:0},
  {q:"Which key is used to move one paragraph down?", options:["Ctrl + Down Arrow","Ctrl + Up Arrow","Alt + Down Arrow","Shift + Down Arrow"], answer:0},
  {q:"Which of the following is a cloud-based document service?", options:["Google Docs","MS Word","MS Excel","Paint"], answer:0},
  {q:"Which device is used to input scanned images?", options:["Scanner","Printer","Monitor","Keyboard"], answer:0},
  {q:"Which of the following is used for video conferencing?", options:["Zoom","MS Word","MS Excel","Paint"], answer:0},
  {q:"Which key combination is used to redo an action in Word?", options:["Ctrl + Y","Ctrl + Z","Ctrl + X","Ctrl + C"], answer:0},
  {q:"Which of the following is used for network printing?", options:["Printer Server","USB Drive","Monitor","Keyboard"], answer:0},
  {q:"Which key combination is used to open file properties?", options:["Alt + Enter","Ctrl + P","Ctrl + S","Ctrl + O"], answer:0},
  {q:"Which protocol is used to fetch emails securely?", options:["IMAPS","HTTP","FTP","SMTP"], answer:0},
  {q:"Which device is used for video input?", options:["Webcam","Monitor","Keyboard","Printer"], answer:0},
  {q:"Which software is used to create charts in Excel?", options:["Insert > Chart","File > Chart","View > Chart","Home > Chart"], answer:0},
  {q:"Which key is used to start spell check in Word?", options:["F7","F1","F5","F12"], answer:0},
  {q:"Which of the following is used to schedule tasks in Windows?", options:["Task Scheduler","Control Panel","Registry","MS Word"], answer:0},
  {q:"Which of the following is used to create hyperlinks in Excel?", options:["Insert > Hyperlink","Home > Hyperlink","View > Hyperlink","Layout > Hyperlink"], answer:0},
  {q:"Which key combination is used to switch between worksheets?", options:["Ctrl + PgUp/PgDn","Ctrl + Tab","Alt + Tab","Ctrl + Shift"], answer:0},
  {q:"Which of the following is used for online forms?", options:["Google Forms","MS Word","MS Excel","MS PowerPoint"], answer:0},
  {q:"Which device is used to detect barcode information?", options:["Barcode Scanner","Monitor","Keyboard","Printer"], answer:0},
  {q:"Which of the following is used for digital drawing?", options:["Graphics Tablet","MS Paint","MS Word","MS Excel"], answer:0},
  {q:"Which key is used to repeat the last action in PowerPoint?", options:["F4","F5","F1","F2"], answer:0},
  {q:"Which software allows database queries?", options:["MS Access","MS Word","MS Excel","Paint"], answer:0},
  {q:"Which protocol ensures secure communication over the internet?", options:["HTTPS","HTTP","FTP","SMTP"], answer:0},
  {q:"Which device is used to output images on paper?", options:["Printer","Monitor","Keyboard","Scanner"], answer:0}
];


// VARIABLES
let current = 0;
let userAnswers = new Array(questions.length);
let questionStatus = new Array(questions.length).fill("not-visited");
let timeLeft = 60 * 60;
let timerInterval;

// SIDEBAR
function loadSidebar() {
  const sb = document.getElementById("questionNumbers");
  sb.innerHTML = "";
  questions.forEach((_, i) => {
    let btn = document.createElement("button");
    btn.innerText = i + 1;
    btn.id = "qBtn" + i;
    btn.onclick = () => { current = i; loadQuestion(); };
    sb.appendChild(btn);
  });
}

// LOAD QUESTION
function loadQuestion() {
  const q = questions[current];
  document.getElementById("question").innerText = (current+1)+". "+q.q;

  let optionsHTML="";
  q.options.forEach((opt,i)=>{
    optionsHTML+=`
    <label>
      <input type="radio" name="option" value="${i}"
      ${userAnswers[current]==i?"checked":""}
      onclick="selectOption(${i})">
      ${opt}
    </label>`;
  });

  document.getElementById("options").innerHTML=optionsHTML;

  if(questionStatus[current]=="not-visited")
    questionStatus[current]="visited";

  updateSidebar();
}

// SELECT OPTION
function selectOption(i){
  userAnswers[current]=i;
}

// SAVE NEXT
function saveNext(){
  if(userAnswers[current]!=undefined)
    questionStatus[current]="answered";
  nextQuestion();
}

// REVIEW
function markReview(){
  questionStatus[current]="review";
  nextQuestion();
}

function nextQuestion(){
  if(current<questions.length-1){
    current++;
    loadQuestion();
  }
}

function prevQuestion(){
  if(current>0){
    current--;
    loadQuestion();
  }
}

// UPDATE SIDEBAR
function updateSidebar(){
  questions.forEach((_,i)=>{
    const btn=document.getElementById("qBtn"+i);
    btn.className="";
    btn.classList.add(questionStatus[i]);
  });
}

// FINISH TEST
/*function finishTest(){

  clearInterval(timerInterval); // STOP TIMER

  let score=0;
  userAnswers.forEach((ans,i)=>{
    if(ans===questions[i].answer) score++;
  });

  document.getElementById("result").innerText =
  "✅ Test Finished | Score: "+score+" / "+questions.length;

  // Disable all inputs
  document.querySelectorAll("input").forEach(inp=>inp.disabled=true);
  document.querySelectorAll(".buttons button").forEach(btn=>btn.disabled=true);

  document.getElementById("homeBtn").style.display="inline-block";
} */

 function finishTest(){

  clearInterval(timerInterval); // STOP TIMER

  let correct = 0;
  let wrong = 0;
  let attempted = 0;
  let notAttempted = 0;

  let wrongQuestionsHTML = "";

  questions.forEach((q, i) => {

    if(userAnswers[i] === undefined){
      notAttempted++;
    } else {
      attempted++;
      if(userAnswers[i] === q.answer){
        correct++;
      } else {
        wrong++;

        wrongQuestionsHTML += `
        <div style="margin-bottom:15px; padding:10px; border:1px solid #ddd; border-radius:6px;">
          <strong>Q${i+1}. ${q.q}</strong><br>
          ❌ Your Answer: ${q.options[userAnswers[i]]}<br>
          ✅ Correct Answer: ${q.options[q.answer]}
        </div>`;
      }
    }

  });

  let percentage = ((correct / questions.length) * 100).toFixed(2);

  document.getElementById("result").innerHTML = `
  <div style="text-align:left;">
    <h3>✅ Test Finished</h3>
    <p><strong>Total Questions:</strong> ${questions.length}</p>
    <p><strong>Attempted:</strong> ${attempted}</p>
    <p><strong>Not Attempted:</strong> ${notAttempted}</p>
    <p><strong>Correct:</strong> ${correct}</p>
    <p><strong>Wrong:</strong> ${wrong}</p>
    <p><strong>Percentage:</strong> ${percentage}%</p>
    <hr>
    <h3>❌ Wrong Questions Detail</h3>
    ${wrongQuestionsHTML || "🎉 No Wrong Answers! Excellent Work!"}
  </div>
  `;

  // Disable inputs
  document.querySelectorAll("input").forEach(inp=>inp.disabled=true);
  document.querySelectorAll(".buttons button").forEach(btn=>btn.disabled=true);

  document.getElementById("homeBtn").style.display="inline-block";
}

// TIMER
function startTimer(){
  timerInterval=setInterval(()=>{
    if(timeLeft<=0){
      clearInterval(timerInterval);
      finishTest();
      return;
    }
    let m=Math.floor(timeLeft/60);
    let s=timeLeft%60;
    document.getElementById("timer").innerText=
    `Time Left: ${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
    timeLeft--;
  },1000);
}

// HOME BUTTON
function goHome(){
  window.location.href="https://pcbpcm.in/ccc/";
}

// INIT
loadSidebar();
loadQuestion();
startTimer();

</script>

</body>
</html>
