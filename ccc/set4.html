<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Online MCQ Test</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #eef2f7;
  display: flex;
  justify-content: center;
  padding: 20px;
}

.container {
  display: flex;
  width: 1000px;
  max-width: 100%;
  background: white;
  border-radius: 12px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.1);
  overflow: hidden;
}

.main {
  flex: 1;
  padding: 25px;
  min-width: 300px;
}

#timer {
  text-align: right;
  font-weight: bold;
  color: red;
  font-size: 18px;
}

.question {
  margin: 20px 0;
  font-size: 18px;
}

.options label {
  display: block;
  margin: 8px 0;
  padding: 6px;
  border-radius: 6px;
  cursor: pointer;
  border: 1px solid #ddd;
}

.buttons {
  margin-top: 20px;
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

button {
  padding: 8px 15px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  background: #4CAF50;
  color: white;
}

button:hover {
  opacity: 0.9;
}

.review-btn {
  background: #9c27b0;
}

.sidebar {
  width: 220px;
  background: #f5f5f5;
  padding: 10px;
  border-left: 1px solid #ddd;
  display: grid;
  grid-template-columns: repeat(4, 45px);
  gap: 8px;
  max-height: 650px;
  overflow-y: auto;
}

.sidebar button {
  width: 45px;
  height: 45px;
  font-weight: bold;
}

.not-visited { background: #fff; color: black; }
.visited { background: #f44336; color: white; }
.answered { background: #4caf50; color: white; }
.review { background: #9c27b0; color: white; }

#result {
  text-align: center;
  font-weight: bold;
  margin-top: 20px;
  font-size: 18px;
}

#homeBtn {
  display: none;
  margin-top: 15px;
  background: #2196F3;
}
</style>
</head>

<body>

<div class="container">

<div class="main">
  <div id="timer">Time Left: 60:00</div>
  <div class="question" id="question"></div>
  <div class="options" id="options"></div>

  <div class="buttons">
    <button onclick="prevQuestion()">Previous</button>
    <button onclick="saveNext()">Save & Next</button>
    <button class="review-btn" onclick="markReview()">Mark for Review</button>
    <button onclick="finishTest()">Finish Test</button>
  </div>

  <button id="homeBtn" onclick="goHome()">Go To Home Page</button>

  <div id="result"></div>
</div>

<div class="sidebar" id="questionNumbers"></div>

</div>

<script>

const questions  = [
  {q:"Which of the following is used to transfer files over the Internet?", options:["FTP","HTTP","SMTP","POP3"], answer:0},
  {q:"Which key is used to switch between open applications?", options:["Alt + Tab","Ctrl + Tab","Shift + Tab","Ctrl + Alt + Del"], answer:0},
  {q:"Which device is used to display computer output visually?", options:["Monitor","Keyboard","Mouse","Printer"], answer:0},
  {q:"Which of the following is a storage device?", options:["Hard Disk","Mouse","Keyboard","Monitor"], answer:0},
  {q:"Which software is used to draw and edit images?", options:["MS Paint","MS Word","MS Excel","MS PowerPoint"], answer:0},
  {q:"Which key is used to insert a page break in Word?", options:["Ctrl + Enter","Ctrl + P","Ctrl + N","Ctrl + S"], answer:0},
  {q:"Which protocol is used for secure email?", options:["SMTPS","HTTP","FTP","POP3"], answer:0},
  {q:"Which of these is a mobile OS?", options:["Android","Windows","Linux","MacOS"], answer:0},
  {q:"Which key combination is used to bold text in Word?", options:["Ctrl + B","Ctrl + I","Ctrl + U","Ctrl + S"], answer:0},
  {q:"Which one is used to connect a printer to a computer?", options:["USB cable","Ethernet cable","HDMI cable","VGA cable"], answer:0},
  {q:"Which of the following is used to create charts in Excel?", options:["Insert > Chart","File > Chart","Home > Chart","View > Chart"], answer:0},
  {q:"Which device is used to capture photos digitally?", options:["Digital Camera","Scanner","Printer","Monitor"], answer:0},
  {q:"Which one is a type of secondary memory?", options:["CD/DVD","RAM","Cache","Registers"], answer:0},
  {q:"Which of the following is an input device for audio?", options:["Microphone","Speaker","Monitor","Printer"], answer:0},
  {q:"Which software is used for typing documents?", options:["MS Word","MS Excel","MS PowerPoint","MS Access"], answer:0},
  {q:"Which of the following is a web browser?", options:["Google Chrome","MS Word","MS Excel","MS PowerPoint"], answer:0},
  {q:"Which key combination is used to copy selected text?", options:["Ctrl + C","Ctrl + X","Ctrl + V","Ctrl + Z"], answer:0},
  {q:"Which device converts digital signals into audio?", options:["Speaker","Monitor","Printer","Scanner"], answer:0},
  {q:"Which protocol is used to receive emails?", options:["POP3","FTP","HTTP","SMTP"], answer:0},
  {q:"Which one is used to schedule emails in Outlook?", options:["Delay Delivery","Send","Reply","Forward"], answer:0},
  {q:"Which of the following is a presentation view in PowerPoint?", options:["Slide Sorter","Normal","Reading","All of the above"], answer:3},
  {q:"Which key is used to delete a character after the cursor?", options:["Delete","Backspace","Enter","Esc"], answer:0},
  {q:"Which software allows database management?", options:["MS Access","MS Word","MS Excel","Paint"], answer:0},
  {q:"Which of the following is a cloud service?", options:["Google Drive","MS Word","MS Excel","Paint"], answer:0},
  {q:"Which key combination is used to italicize text?", options:["Ctrl + I","Ctrl + B","Ctrl + U","Ctrl + S"], answer:0},
  {q:"Which one is used for online video meetings?", options:["Google Meet","MS Word","MS Excel","MS Paint"], answer:0},
  {q:"Which is used to prevent unauthorized network access?", options:["Firewall","MS Word","Excel","PowerPoint"], answer:0},
  {q:"Which of the following is used to undo an action?", options:["Ctrl + Z","Ctrl + Y","Ctrl + X","Ctrl + C"], answer:0},
  {q:"Which shortcut opens a new window in a browser?", options:["Ctrl + N","Ctrl + O","Ctrl + W","Ctrl + S"], answer:0},
  {q:"Which key is used to start a slideshow in PowerPoint?", options:["F5","F1","F2","F3"], answer:0},
  {q:"Which one is used to calculate in Excel?", options:["Formula Bar","Menu Bar","Status Bar","Title Bar"], answer:0},
  {q:"Which of the following stores temporary files?", options:["Cache","Hard Disk","CD","DVD"], answer:0},
  {q:"Which key is used to open print dialog?", options:["Ctrl + P","Ctrl + S","Ctrl + C","Ctrl + V"], answer:0},
  {q:"Which of the following is used for audio output?", options:["Speaker","Monitor","Printer","Keyboard"], answer:0},
  {q:"Which protocol is used to transfer secure files?", options:["SFTP","HTTP","SMTP","POP3"], answer:0},
  {q:"Which one is used to create hyperlinks in Word?", options:["Insert > Hyperlink","Home > Hyperlink","View > Hyperlink","Format > Hyperlink"], answer:0},
  {q:"Which key combination is used to underline text?", options:["Ctrl + U","Ctrl + I","Ctrl + B","Ctrl + S"], answer:0},
  {q:"Which device is used to connect multiple networks?", options:["Router","Monitor","Keyboard","Printer"], answer:0},
  {q:"Which of the following is used for online surveys?", options:["Google Forms","MS Word","MS Excel","PowerPoint"], answer:0},
  {q:"Which software is used for animation?", options:["MS PowerPoint","MS Word","MS Excel","Paint"], answer:0},
  {q:"Which of these is an input device for images?", options:["Scanner","Monitor","Keyboard","Mouse"], answer:0},
  {q:"Which one is used to change page orientation in Word?", options:["Layout > Orientation","Home > Orientation","Insert > Orientation","View > Orientation"], answer:0},
  {q:"Which protocol is used for secure web browsing?", options:["HTTPS","HTTP","FTP","SMTP"], answer:0},
  {q:"Which shortcut key opens the Find dialog?", options:["Ctrl + F","Ctrl + H","Ctrl + S","Ctrl + P"], answer:0},
  {q:"Which of the following is used to backup data?", options:["External Hard Disk","Monitor","Keyboard","Mouse"], answer:0},
  {q:"Which software is used for email management?", options:["MS Outlook","MS Word","MS Excel","MS PowerPoint"], answer:0},
  {q:"Which key combination is used to redo typing?", options:["Ctrl + Y","Ctrl + Z","Ctrl + X","Ctrl + C"], answer:0},
  {q:"Which of the following is used for real-time chat?", options:["Instant Messaging","Email","MS Word","Excel"], answer:0},
  {q:"Which one is used to create tables in Excel?", options:["Insert > Table","Home > Table","View > Table","Layout > Table"], answer:0},
  {q:"Which key combination is used to open a document?", options:["Ctrl + O","Ctrl + N","Ctrl + S","Ctrl + P"], answer:0},
  {q:"Which one is used to zoom slides in PowerPoint?", options:["View > Zoom","Insert > Zoom","Home > Zoom","Design > Zoom"], answer:0}
];



// VARIABLES
let current = 0;
let userAnswers = new Array(questions.length);
let questionStatus = new Array(questions.length).fill("not-visited");
let timeLeft = 60 * 60;
let timerInterval;

// SIDEBAR
function loadSidebar() {
  const sb = document.getElementById("questionNumbers");
  sb.innerHTML = "";
  questions.forEach((_, i) => {
    let btn = document.createElement("button");
    btn.innerText = i + 1;
    btn.id = "qBtn" + i;
    btn.onclick = () => { current = i; loadQuestion(); };
    sb.appendChild(btn);
  });
}

// LOAD QUESTION
function loadQuestion() {
  const q = questions[current];
  document.getElementById("question").innerText = (current+1)+". "+q.q;

  let optionsHTML="";
  q.options.forEach((opt,i)=>{
    optionsHTML+=`
    <label>
      <input type="radio" name="option" value="${i}"
      ${userAnswers[current]==i?"checked":""}
      onclick="selectOption(${i})">
      ${opt}
    </label>`;
  });

  document.getElementById("options").innerHTML=optionsHTML;

  if(questionStatus[current]=="not-visited")
    questionStatus[current]="visited";

  updateSidebar();
}

// SELECT OPTION
function selectOption(i){
  userAnswers[current]=i;
}

// SAVE NEXT
function saveNext(){
  if(userAnswers[current]!=undefined)
    questionStatus[current]="answered";
  nextQuestion();
}

// REVIEW
function markReview(){
  questionStatus[current]="review";
  nextQuestion();
}

function nextQuestion(){
  if(current<questions.length-1){
    current++;
    loadQuestion();
  }
}

function prevQuestion(){
  if(current>0){
    current--;
    loadQuestion();
  }
}

// UPDATE SIDEBAR
function updateSidebar(){
  questions.forEach((_,i)=>{
    const btn=document.getElementById("qBtn"+i);
    btn.className="";
    btn.classList.add(questionStatus[i]);
  });
}

// FINISH TEST
/*function finishTest(){

  clearInterval(timerInterval); // STOP TIMER

  let score=0;
  userAnswers.forEach((ans,i)=>{
    if(ans===questions[i].answer) score++;
  });

  document.getElementById("result").innerText =
  "✅ Test Finished | Score: "+score+" / "+questions.length;

  // Disable all inputs
  document.querySelectorAll("input").forEach(inp=>inp.disabled=true);
  document.querySelectorAll(".buttons button").forEach(btn=>btn.disabled=true);

  document.getElementById("homeBtn").style.display="inline-block";
} */

 function finishTest(){

  clearInterval(timerInterval); // STOP TIMER

  let correct = 0;
  let wrong = 0;
  let attempted = 0;
  let notAttempted = 0;

  let wrongQuestionsHTML = "";

  questions.forEach((q, i) => {

    if(userAnswers[i] === undefined){
      notAttempted++;
    } else {
      attempted++;
      if(userAnswers[i] === q.answer){
        correct++;
      } else {
        wrong++;

        wrongQuestionsHTML += `
        <div style="margin-bottom:15px; padding:10px; border:1px solid #ddd; border-radius:6px;">
          <strong>Q${i+1}. ${q.q}</strong><br>
          ❌ Your Answer: ${q.options[userAnswers[i]]}<br>
          ✅ Correct Answer: ${q.options[q.answer]}
        </div>`;
      }
    }

  });

  let percentage = ((correct / questions.length) * 100).toFixed(2);

  document.getElementById("result").innerHTML = `
  <div style="text-align:left;">
    <h3>✅ Test Finished</h3>
    <p><strong>Total Questions:</strong> ${questions.length}</p>
    <p><strong>Attempted:</strong> ${attempted}</p>
    <p><strong>Not Attempted:</strong> ${notAttempted}</p>
    <p><strong>Correct:</strong> ${correct}</p>
    <p><strong>Wrong:</strong> ${wrong}</p>
    <p><strong>Percentage:</strong> ${percentage}%</p>
    <hr>
    <h3>❌ Wrong Questions Detail</h3>
    ${wrongQuestionsHTML || "🎉 No Wrong Answers! Excellent Work!"}
  </div>
  `;

  // Disable inputs
  document.querySelectorAll("input").forEach(inp=>inp.disabled=true);
  document.querySelectorAll(".buttons button").forEach(btn=>btn.disabled=true);

  document.getElementById("homeBtn").style.display="inline-block";
}

// TIMER
function startTimer(){
  timerInterval=setInterval(()=>{
    if(timeLeft<=0){
      clearInterval(timerInterval);
      finishTest();
      return;
    }
    let m=Math.floor(timeLeft/60);
    let s=timeLeft%60;
    document.getElementById("timer").innerText=
    `Time Left: ${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
    timeLeft--;
  },1000);
}

// HOME BUTTON
function goHome(){
  window.location.href="https://pcbpcm.in/ccc/";
}

// INIT
loadSidebar();
loadQuestion();
startTimer();

</script>

</body>
</html>
