<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Online MCQ Test</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #eef2f7;
  display: flex;
  justify-content: center;
  padding: 20px;
}

.container {
  display: flex;
  width: 1000px;
  max-width: 100%;
  background: white;
  border-radius: 12px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.1);
  overflow: hidden;
}

.main {
  flex: 1;
  padding: 25px;
  min-width: 300px;
}

#timer {
  text-align: right;
  font-weight: bold;
  color: red;
  font-size: 18px;
}

.question {
  margin: 20px 0;
  font-size: 18px;
}

.options label {
  display: block;
  margin: 8px 0;
  padding: 6px;
  border-radius: 6px;
  cursor: pointer;
  border: 1px solid #ddd;
}

.buttons {
  margin-top: 20px;
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

button {
  padding: 8px 15px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  background: #4CAF50;
  color: white;
}

button:hover {
  opacity: 0.9;
}

.review-btn {
  background: #9c27b0;
}

.sidebar {
  width: 220px;
  background: #f5f5f5;
  padding: 10px;
  border-left: 1px solid #ddd;
  display: grid;
  grid-template-columns: repeat(4, 45px);
  gap: 8px;
  max-height: 650px;
  overflow-y: auto;
}

.sidebar button {
  width: 45px;
  height: 45px;
  font-weight: bold;
}

.not-visited { background: #fff; color: black; }
.visited { background: #f44336; color: white; }
.answered { background: #4caf50; color: white; }
.review { background: #9c27b0; color: white; }

#result {
  text-align: center;
  font-weight: bold;
  margin-top: 20px;
  font-size: 18px;
}

#homeBtn {
  display: none;
  margin-top: 15px;
  background: #2196F3;
}
</style>
</head>

<body>

<div class="container">

<div class="main">
  <div id="timer">Time Left: 60:00</div>
  <div class="question" id="question"></div>
  <div class="options" id="options"></div>

  <div class="buttons">
    <button onclick="prevQuestion()">Previous</button>
    <button onclick="saveNext()">Save & Next</button>
    <button class="review-btn" onclick="markReview()">Mark for Review</button>
    <button onclick="finishTest()">Finish Test</button>
  </div>

  <button id="homeBtn" onclick="goHome()">Go To Home Page</button>

  <div id="result"></div>
</div>

<div class="sidebar" id="questionNumbers"></div>

</div>

<script>
const questions  = [
  {q:"Which of the following is used to protect data on a hard drive?", options:["BitLocker","Antivirus","Firewall","Recycle Bin"], answer:0},
  {q:"Which key combination is used to lock a Windows computer?", options:["Windows + L","Ctrl + L","Alt + L","Shift + L"], answer:0},
  {q:"Which device is used to project a computer screen onto a wall?", options:["Projector","Monitor","Printer","Scanner"], answer:0},
  {q:"Which software is used to edit videos?", options:["Adobe Premiere Pro","MS Word","MS Excel","Paint"], answer:0},
  {q:"Which shortcut key is used to open a document in Word?", options:["Ctrl + O","Ctrl + N","Ctrl + S","Ctrl + P"], answer:0},
  {q:"Which protocol is used to transfer files over the internet?", options:["FTP","HTTP","SMTP","POP3"], answer:0},
  {q:"Which of the following is used to schedule emails?", options:["Outlook Calendar","MS Word","MS Excel","Paint"], answer:0},
  {q:"Which software is used to create forms for surveys?", options:["Google Forms","MS Word","MS Excel","MS PowerPoint"], answer:0},
  {q:"Which key is used to move the cursor one word to the right?", options:["Ctrl + Right Arrow","Ctrl + Left Arrow","Alt + Right Arrow","Alt + Left Arrow"], answer:0},
  {q:"Which device is used to convert analog signals to digital signals?", options:["Analog-to-Digital Converter","Digital-to-Analog Converter","Router","Switch"], answer:0},
  {q:"Which software is used to annotate PDF files?", options:["Adobe Acrobat Reader","MS Word","MS Excel","Paint"], answer:0},
  {q:"Which key combination is used to open the Find dialog in Word?", options:["Ctrl + F","Ctrl + H","Ctrl + S","Ctrl + P"], answer:0},
  {q:"Which of the following is used to encrypt emails?", options:["PGP","SMTP","HTTP","FTP"], answer:0},
  {q:"Which device is used to measure network traffic?", options:["Network Analyzer","Monitor","Keyboard","Printer"], answer:0},
  {q:"Which software is used to create infographics?", options:["Canva","MS Word","MS Excel","Paint"], answer:0},
  {q:"Which of the following is a protocol for receiving emails?", options:["POP3","SMTP","HTTP","FTP"], answer:0},
  {q:"Which key is used to move the cursor to the beginning of the document?", options:["Ctrl + Home","Ctrl + End","Page Up","Page Down"], answer:0},
  {q:"Which malware hides itself in legitimate programs?", options:["Trojan Horse","Virus","Worm","Spyware"], answer:0},
  {q:"Which software is used to edit vector images?", options:["Adobe Illustrator","MS Paint","MS Word","MS Excel"], answer:0},
  {q:"Which key combination is used to select a paragraph?", options:["Ctrl + Shift + Down Arrow","Ctrl + A","Shift + Click","Alt + Click"], answer:0},
  {q:"Which device allows multiple computers to share a single internet connection?", options:["Router","Switch","Printer","Monitor"], answer:0},
  {q:"Which software is used to create timelines and Gantt charts?", options:["MS Project","MS Word","MS Excel","Paint"], answer:0},
  {q:"Which key combination is used to move to the next worksheet in Excel?", options:["Ctrl + PgDn","Ctrl + Tab","Alt + Tab","Ctrl + Shift"], answer:0},
  {q:"Which protocol is used for secure file transfer?", options:["SFTP","FTP","HTTP","SMTP"], answer:0},
  {q:"Which device is used to detect motion for security purposes?", options:["Motion Sensor","Camera","Monitor","Printer"], answer:0},
  {q:"Which software is used to create 3D models?", options:["Blender","MS Word","MS Excel","Paint"], answer:0},
  {q:"Which key combination is used to hide all windows in Windows?", options:["Windows + D","Alt + F4","Ctrl + H","Windows + L"], answer:0},
  {q:"Which of the following stores temporary internet files?", options:["Cache","Registry","RAM","ROM"], answer:0},
  {q:"Which software is used to create mind maps?", options:["XMind","MS Word","MS Excel","Paint"], answer:0},
  {q:"Which key is used to insert a page break in Word?", options:["Ctrl + Enter","Ctrl + Shift + Enter","Alt + Enter","Shift + Enter"], answer:0},
  {q:"Which of the following is used to track changes in Word?", options:["Track Changes","Comments","View","Insert"], answer:0},
  {q:"Which device is used to connect a computer to a TV?", options:["HDMI Cable","VGA Cable","USB Cable","Ethernet Cable"], answer:0},
  {q:"Which software is used for collaborative document editing online?", options:["Google Docs","MS Word","MS Excel","Paint"], answer:0},
  {q:"Which key combination is used to open Developer Tools in a browser?", options:["F12","Ctrl + F12","Alt + F12","Shift + F12"], answer:0},
  {q:"Which of the following is a cloud storage option?", options:["Dropbox","MS Word","MS Excel","Paint"], answer:0},
  {q:"Which device is used to measure CPU temperature?", options:["Temperature Sensor","Thermometer","Monitor","Printer"], answer:0},
  {q:"Which software is used to create flowcharts?", options:["MS Visio","MS Word","MS Excel","Paint"], answer:0},
  {q:"Which key is used to add a new slide in PowerPoint?", options:["Ctrl + M","Ctrl + N","Ctrl + S","Ctrl + P"], answer:0},
  {q:"Which protocol is used to send files securely over the internet?", options:["FTPS","FTP","HTTP","SMTP"], answer:0},
  {q:"Which device converts digital signals to sound?", options:["Speakers","Monitor","Printer","Keyboard"], answer:0},
  {q:"Which software is used to create infographics with templates?", options:["Canva","MS Word","MS Excel","Paint"], answer:0},
  {q:"Which key combination is used to minimize all windows?", options:["Windows + M","Alt + Tab","Ctrl + M","Windows + L"], answer:0},
  {q:"Which of the following is used for online video editing?", options:["WeVideo","MS Word","MS Excel","Paint"], answer:0},
  {q:"Which device is used to detect fingerprint?", options:["Fingerprint Scanner","Webcam","Monitor","Printer"], answer:0},
  {q:"Which software is used to create interactive PDFs?", options:["Adobe Acrobat Pro","MS Word","MS Excel","Paint"], answer:0},
  {q:"Which key combination is used to open the Run dialog in Windows?", options:["Windows + R","Windows + E","Ctrl + R","Alt + R"], answer:0},
  {q:"Which of the following is used to monitor network bandwidth?", options:["Network Monitor","Task Manager","Registry","MS Word"], answer:0},
  {q:"Which device is used to capture live video?", options:["Webcam","Scanner","Printer","Keyboard"], answer:0},
  {q:"Which key is used to insert a hyperlink in Word?", options:["Ctrl + K","Ctrl + H","Ctrl + L","Ctrl + U"], answer:0},
  {q:"Which software is used to create online surveys?", options:["Google Forms","MS Word","MS Excel","Paint"], answer:0},
  {q:"Which key combination is used to take a screenshot in Windows?", options:["Windows + PrtScn","Alt + PrtScn","Ctrl + PrtScn","Shift + PrtScn"], answer:0},
  {q:"Which device is used to detect smoke?", options:["Smoke Detector","Monitor","Keyboard","Printer"], answer:0}
];


// VARIABLES
let current = 0;
let userAnswers = new Array(questions.length);
let questionStatus = new Array(questions.length).fill("not-visited");
let timeLeft = 60 * 60;
let timerInterval;

// SIDEBAR
function loadSidebar() {
  const sb = document.getElementById("questionNumbers");
  sb.innerHTML = "";
  questions.forEach((_, i) => {
    let btn = document.createElement("button");
    btn.innerText = i + 1;
    btn.id = "qBtn" + i;
    btn.onclick = () => { current = i; loadQuestion(); };
    sb.appendChild(btn);
  });
}

// LOAD QUESTION
function loadQuestion() {
  const q = questions[current];
  document.getElementById("question").innerText = (current+1)+". "+q.q;

  let optionsHTML="";
  q.options.forEach((opt,i)=>{
    optionsHTML+=`
    <label>
      <input type="radio" name="option" value="${i}"
      ${userAnswers[current]==i?"checked":""}
      onclick="selectOption(${i})">
      ${opt}
    </label>`;
  });

  document.getElementById("options").innerHTML=optionsHTML;

  if(questionStatus[current]=="not-visited")
    questionStatus[current]="visited";

  updateSidebar();
}

// SELECT OPTION
function selectOption(i){
  userAnswers[current]=i;
}

// SAVE NEXT
function saveNext(){
  if(userAnswers[current]!=undefined)
    questionStatus[current]="answered";
  nextQuestion();
}

// REVIEW
function markReview(){
  questionStatus[current]="review";
  nextQuestion();
}

function nextQuestion(){
  if(current<questions.length-1){
    current++;
    loadQuestion();
  }
}

function prevQuestion(){
  if(current>0){
    current--;
    loadQuestion();
  }
}

// UPDATE SIDEBAR
function updateSidebar(){
  questions.forEach((_,i)=>{
    const btn=document.getElementById("qBtn"+i);
    btn.className="";
    btn.classList.add(questionStatus[i]);
  });
}

// FINISH TEST
/*function finishTest(){

  clearInterval(timerInterval); // STOP TIMER

  let score=0;
  userAnswers.forEach((ans,i)=>{
    if(ans===questions[i].answer) score++;
  });

  document.getElementById("result").innerText =
  "✅ Test Finished | Score: "+score+" / "+questions.length;

  // Disable all inputs
  document.querySelectorAll("input").forEach(inp=>inp.disabled=true);
  document.querySelectorAll(".buttons button").forEach(btn=>btn.disabled=true);

  document.getElementById("homeBtn").style.display="inline-block";
} */

 function finishTest(){

  clearInterval(timerInterval); // STOP TIMER

  let correct = 0;
  let wrong = 0;
  let attempted = 0;
  let notAttempted = 0;

  let wrongQuestionsHTML = "";

  questions.forEach((q, i) => {

    if(userAnswers[i] === undefined){
      notAttempted++;
    } else {
      attempted++;
      if(userAnswers[i] === q.answer){
        correct++;
      } else {
        wrong++;

        wrongQuestionsHTML += `
        <div style="margin-bottom:15px; padding:10px; border:1px solid #ddd; border-radius:6px;">
          <strong>Q${i+1}. ${q.q}</strong><br>
          ❌ Your Answer: ${q.options[userAnswers[i]]}<br>
          ✅ Correct Answer: ${q.options[q.answer]}
        </div>`;
      }
    }

  });

  let percentage = ((correct / questions.length) * 100).toFixed(2);

  document.getElementById("result").innerHTML = `
  <div style="text-align:left;">
    <h3>✅ Test Finished</h3>
    <p><strong>Total Questions:</strong> ${questions.length}</p>
    <p><strong>Attempted:</strong> ${attempted}</p>
    <p><strong>Not Attempted:</strong> ${notAttempted}</p>
    <p><strong>Correct:</strong> ${correct}</p>
    <p><strong>Wrong:</strong> ${wrong}</p>
    <p><strong>Percentage:</strong> ${percentage}%</p>
    <hr>
    <h3>❌ Wrong Questions Detail</h3>
    ${wrongQuestionsHTML || "🎉 No Wrong Answers! Excellent Work!"}
  </div>
  `;

  // Disable inputs
  document.querySelectorAll("input").forEach(inp=>inp.disabled=true);
  document.querySelectorAll(".buttons button").forEach(btn=>btn.disabled=true);

  document.getElementById("homeBtn").style.display="inline-block";
}

// TIMER
function startTimer(){
  timerInterval=setInterval(()=>{
    if(timeLeft<=0){
      clearInterval(timerInterval);
      finishTest();
      return;
    }
    let m=Math.floor(timeLeft/60);
    let s=timeLeft%60;
    document.getElementById("timer").innerText=
    `Time Left: ${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
    timeLeft--;
  },1000);
}

// HOME BUTTON
function goHome(){
  window.location.href="https://pcbpcm.in/ccc/";
}

// INIT
loadSidebar();
loadQuestion();
startTimer();

</script>

</body>
</html>
