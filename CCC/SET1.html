<style>
body {
  font-family: Arial, sans-serif;
  background: #eef2f7;
  margin: 0;
  padding: 10px;
}

.container {
  display: flex;
  flex-wrap: wrap; /* mobile ke liye wrap */
  max-width: 950px;
  margin: auto;
  background: white;
  border-radius: 12px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.1);
  overflow: hidden;
}

.main {
  flex: 1 1 600px;
  padding: 20px;
  min-width: 300px;
}

#timer {
  text-align: right;
  font-weight: bold;
  color: red;
}

.question {
  margin: 20px 0;
  font-size: 18px;
}

.options label {
  display: block;
  margin: 8px 0;
  padding: 10px;
  border-radius: 6px;
  cursor: pointer;
  border: 1px solid #ddd;
}

.options label.correct {
  background: #c8e6c9;
  border-color: #4caf50;
}

.options label.wrong {
  background: #ffcdd2;
  border-color: #f44336;
}

.buttons {
  margin-top: 20px;
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

button.action-btn {
  padding: 10px 15px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  background: #4CAF50;
  color: white;
  flex: 1 1 120px;
}

button.action-btn:hover {
  background: #45a049;
}

button.review-btn {
  background: #9c27b0;
}

button.review-btn:hover {
  background: #7b1fa2;
}

/* Sidebar grid responsive */
.sidebar {
  width: 200px;
  background: #f5f5f5;
  padding: 10px;
  border-left: 1px solid #ddd;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(40px, 1fr)); /* responsive grid */
  gap: 8px;
  max-height: 650px;
  overflow-y: auto;
  flex: 0 0 200px;
}

.sidebar button {
  width: 100%;
  height: 40px;
  border-radius: 6px;
  border: 1px solid #aaa;
  cursor: pointer;
  background: #fff;
  font-weight: bold;
}

.sidebar button.not-visited { background: #fff; color:black; }
.sidebar button.visited { background: #f44336; color:white; }
.sidebar button.answered { background: #4caf50; color:white; }
.sidebar button.review { background: #9c27b0; color:white; }
.sidebar button.review-answered::after { content:"✔️"; font-size:12px; margin-left:2px; }

#result { text-align:center; font-weight:bold; margin-top:15px; font-size:18px; }

/* Mobile adjustments */
@media(max-width:768px){
  .container { flex-direction: column; }
  .sidebar { width: 100%; border-left:none; border-top:1px solid #ddd; max-height:200px; }
  .main { min-width: auto; }
}
</style>
