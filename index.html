<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Open Web Page</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #4facfe, #00f2fe);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      background: #fff;
      padding: 40px;
      border-radius: 15px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }

    h1 {
      margin-bottom: 20px;
      color: #333;
    }

    button {
      padding: 15px 30px;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      background: #4facfe;
      color: white;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #00c6ff;
      transform: scale(1.05);
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>WWW.PCBPCM.COM</h1>
    <p>Click the button below to open the website</p>

    <button onclick="openPage()">Open Home Page</button>
  </div>

  <script>
    function openPage() {
      window.open("https://www.pcbpcm.com/", "_blank");
    }
  </script>

</body>
</html>
